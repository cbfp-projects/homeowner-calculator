name: Daily rate update

on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.1.1
        with:
          python-version: '3.12'

      - name: Update Bay Area city rates
        run: python scripts/update_bay_area_rates.py

      - name: Validate rate JSON shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/bay-area-city-rates.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          assert isinstance(data, dict), 'Root must be an object'
          assert isinstance(data.get('lastUpdated'), str) and data['lastUpdated'], 'lastUpdated is required'
          assert isinstance(data.get('loanType'), str) and data['loanType'], 'loanType is required'
          assert isinstance(data.get('estimateBasis'), str) and data['estimateBasis'], 'estimateBasis is required'
          assert isinstance(data.get('rates'), list) and data['rates'], 'rates must be a non-empty array'

          for idx, entry in enumerate(data['rates']):
              assert isinstance(entry, dict), f'rates[{idx}] must be object'
              assert isinstance(entry.get('city'), str) and entry['city'], f'rates[{idx}].city invalid'
              assert isinstance(entry.get('rate'), (int, float)), f'rates[{idx}].rate invalid'
          print('JSON shape validation passed')
          PY

      - name: Run tests
        run: python -m unittest -v

      - name: Commit refreshed rates
        run: |
          if git diff --quiet -- data/bay-area-city-rates.json index.html; then
            echo "No rate changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bay-area-city-rates.json index.html
          git commit -m "chore: refresh bay area rates data"
          git push
